<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6200ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mini QR">
  <title>Mini QR-Code Generator</title>
  <link rel="manifest" href="./manifest.webmanifest?v=1">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png?v=1">
  <link rel="shortcut icon" type="image/png" href="./favicon-32x32.png?v=1">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=1">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png?v=1">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=1">
  <script src="qrcode.min.js"></script>
  <style>
    :root { --primary:#6200ea; --bg:#f4f5f7; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; padding:18px; }
    .container { width:100%; max-width:480px; background:#fff; padding:22px; border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,.08); }
    h2 { margin:0 0 18px; text-align:center; color:var(--primary); font-size:1.45rem; }
    label { display:block; margin-top:11px; font-size:13px; font-weight:700; color:#4b5563; }
    input[type="text"], input[type="email"], input[type="tel"], input[type="number"], textarea, select { width:100%; padding:12px; margin-top:7px; border:2px solid #eee; border-radius:9px; font:inherit; background:#fff; }
    textarea { min-height:84px; resize:vertical; }
    input:focus, textarea:focus, select:focus { outline:none; border-color:#c4b5fd; }
    .hidden { display:none !important; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .color-section { margin-top:14px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .color-card { border:1px solid var(--line); border-radius:12px; padding:10px; }
    .color-title { display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:700; margin-bottom:8px; }
    .color-preview { width:34px; height:34px; border-radius:9px; border:1px solid #d1d5db; }
    .preset-row { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
    .preset { aspect-ratio:1; border-radius:8px; border:2px solid #fff; box-shadow:0 0 0 1px #d1d5db; cursor:pointer; min-width:0; }
    .custom-color { margin-top:8px; display:flex; align-items:center; gap:8px; }
    .custom-color input[type="color"] { width:44px; height:38px; padding:0; border:1px solid #d1d5db; border-radius:8px; background:#fff; }
    .hex { flex:1; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; text-transform:uppercase; }
    .status { min-height:20px; margin-top:10px; font-size:12px; color:var(--muted); }
    .status.warn { color:#b45309; }
    .status.error { color:#b91c1c; }
    button { width:100%; padding:14px; border:none; border-radius:9px; margin-top:14px; background:var(--primary); color:white; font-weight:800; cursor:pointer; font-size:14px; }
    button.secondary { background:#111827; }
    #qrDisplay { display:flex; justify-content:center; align-items:center; margin:22px 0 12px; overflow:auto; }
    #qrDisplay canvas, #qrDisplay img { max-width:100%; height:auto !important; }
    .wifi-extra { margin-top:2px; }
    @media (max-width:520px) {
      body { padding:10px; }
      .container { padding:16px; border-radius:14px; }
      .color-section, .grid2 { grid-template-columns:1fr; }
      .preset-row { grid-template-columns:repeat(8,1fr); }
    }
  </style>
</head>
<body>
<div class="container">
  <h2>Mini QR-Code Generator</h2>

  <label>QR Type</label>
  <select id="type" onchange="updateUI()">
    <option value="text">Plain Text</option>
    <option value="url" selected>Website URL</option>
    <option value="wifi">WiFi</option>
    <option value="whatsapp">WhatsApp</option>
    <option value="vcard">vCard</option>
    <option value="sms">SMS</option>
    <option value="email">Email</option>
    <option value="geo">Location</option>
  </select>

  <div id="field1Wrap"><label id="l1">Website URL</label><input type="text" id="in1" autocomplete="off"></div>
  <div id="field2Wrap" class="hidden"><label id="l2">Extra</label><input type="text" id="in2" autocomplete="off"></div>
  <div id="field3Wrap" class="hidden"><label id="l3">Extra</label><textarea id="in3"></textarea></div>

  <div id="wifiTypeWrap" class="hidden wifi-extra">
    <label>WiFi Security</label>
    <select id="wifiType">
      <option value="WPA">WPA / WPA2</option>
      <option value="WEP">WEP</option>
      <option value="nopass">Open / No Password</option>
    </select>
  </div>

  <label>Resolution</label>
  <select id="res">
    <option value="128">Tiny (128px)</option>
    <option value="256">Medium (256px)</option>
    <option value="512">Web Standard (512px)</option>
    <option value="1024" selected>HD (1024px)</option>
  </select>

  <div class="color-section">
    <div class="color-card">
      <div class="color-title"><span>Foreground</span><div class="color-preview" id="fgPreview"></div></div>
      <div class="preset-row" id="fgPresets"></div>
      <div class="custom-color">
        <input type="color" id="fgColor" value="#000000" aria-label="Custom foreground color">
        <input type="text" id="fgHex" class="hex" value="#000000" maxlength="7" aria-label="Foreground hex color">
      </div>
    </div>
    <div class="color-card">
      <div class="color-title"><span>Background</span><div class="color-preview" id="bgPreview"></div></div>
      <div class="preset-row" id="bgPresets"></div>
      <div class="custom-color">
        <input type="color" id="bgColor" value="#ffffff" aria-label="Custom background color">
        <input type="text" id="bgHex" class="hex" value="#FFFFFF" maxlength="7" aria-label="Background hex color">
      </div>
    </div>
  </div>

  <div id="status" class="status"></div>
  <button onclick="generateQR()">Generate QR Code</button>
  <div id="qrDisplay"></div>
  <button id="dlBtn" class="secondary hidden" onclick="downloadQR()">Download PNG</button>
</div>

<script>
  const palettes = ['#000000','#1F2937','#2563EB','#7C3AED','#DC2626','#EA580C','#16A34A','#FFFFFF'];

  function escWifi(s='') { return String(s).replace(/([\\;,:"])/g, '\\$1'); }
  function escVcard(s='') { return String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,'); }
  function cleanPhone(s='') { return String(s).replace(/[^0-9]/g,''); }
  function validHex(v) { return /^#[0-9a-fA-F]{6}$/.test(v); }

  function setStatus(msg='', kind='') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  function setupColor(prefix, start) {
    const color = document.getElementById(prefix+'Color');
    const hex = document.getElementById(prefix+'Hex');
    const preview = document.getElementById(prefix+'Preview');
    const presets = document.getElementById(prefix+'Presets');
    function apply(v, regen=true) {
      if (!validHex(v)) return;
      color.value = v;
      hex.value = v.toUpperCase();
      preview.style.background = v;
      if (regen && document.querySelector('#qrDisplay canvas')) generateQR(false);
    }
    palettes.forEach(v => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'preset'; b.style.background = v; b.title = v;
      b.onclick = () => apply(v);
      presets.appendChild(b);
    });
    color.addEventListener('input', e => apply(e.target.value));
    hex.addEventListener('change', e => {
      let v = e.target.value.trim(); if (!v.startsWith('#')) v = '#' + v;
      if (validHex(v)) apply(v); else { hex.value = color.value.toUpperCase(); setStatus('Use a 6-digit hex color such as #000000.', 'error'); }
    });
    apply(start, false);
  }

  function luminance(hex) {
    const rgb = [1,3,5].map(i => parseInt(hex.slice(i,i+2),16)/255).map(c => c <= .03928 ? c/12.92 : Math.pow((c+.055)/1.055,2.4));
    return .2126*rgb[0] + .7152*rgb[1] + .0722*rgb[2];
  }
  function contrastRatio(a,b) {
    const l1=luminance(a), l2=luminance(b); return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);
  }

  function updateUI() {
    const type = document.getElementById('type').value;
    const cfg = {
      text:{l1:'Text',p1:'Type anything'},
      url:{l1:'Website URL',p1:'https://example.com'},
      wifi:{l1:'WiFi ID (SSID)',p1:'MyWiFi',l2:'WiFi Password',p2:'Password123'},
      whatsapp:{l1:'WhatsApp Number',p1:'60123456789'},
      vcard:{l1:'Full Name',p1:'John Doe',l2:'Phone',p2:'0123456789',l3:'Email',p3:'name@example.com'},
      sms:{l1:'Phone Number',p1:'0123456789',l2:'Message',p2:'Hello'},
      email:{l1:'Email Address',p1:'email@example.com',l2:'Subject',p2:'Hello',l3:'Message',p3:'Your message'},
      geo:{l1:'Latitude',p1:'3.1390',l2:'Longitude',p2:'101.6869'}
    }[type];

    document.getElementById('l1').textContent=cfg.l1; document.getElementById('in1').placeholder=cfg.p1;
    ['field2Wrap','field3Wrap','wifiTypeWrap'].forEach(id=>document.getElementById(id).classList.add('hidden'));
    if (cfg.l2) { document.getElementById('l2').textContent=cfg.l2; document.getElementById('in2').placeholder=cfg.p2; document.getElementById('field2Wrap').classList.remove('hidden'); }
    if (cfg.l3) { document.getElementById('l3').textContent=cfg.l3; document.getElementById('in3').placeholder=cfg.p3; document.getElementById('field3Wrap').classList.remove('hidden'); }
    if (type==='wifi') document.getElementById('wifiTypeWrap').classList.remove('hidden');
    setStatus('');
  }

  function buildPayload() {
    const type=document.getElementById('type').value;
    const v1=document.getElementById('in1').value.trim();
    const v2=document.getElementById('in2').value.trim();
    const v3=document.getElementById('in3').value.trim();
    if (!v1) throw new Error('Enter the required information first.');

    if (type==='text') return v1;
    if (type==='url') {
      let url=v1; if (!/^https?:\/\//i.test(url)) url='https://'+url; return url;
    }
    if (type==='wifi') {
      const sec=document.getElementById('wifiType').value;
      return `WIFI:T:${sec};S:${escWifi(v1)};${sec==='nopass'?'':'P:'+escWifi(v2)+';'};`;
    }
    if (type==='whatsapp') {
      const n=cleanPhone(v1); if (!n) throw new Error('Enter a valid WhatsApp number.'); return `https://wa.me/${n}`;
    }
    if (type==='vcard') {
      return `BEGIN:VCARD\nVERSION:3.0\nFN:${escVcard(v1)}\nTEL:${escVcard(v2)}${v3?`\nEMAIL:${escVcard(v3)}`:''}\nEND:VCARD`;
    }
    if (type==='sms') {
      const n=cleanPhone(v1); if (!n) throw new Error('Enter a valid phone number.'); return `sms:${n}${v2?'?body='+encodeURIComponent(v2):''}`;
    }
    if (type==='email') {
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v1)) throw new Error('Enter a valid email address.');
      const q=[]; if(v2)q.push('subject='+encodeURIComponent(v2)); if(v3)q.push('body='+encodeURIComponent(v3)); return `mailto:${v1}${q.length?'?'+q.join('&'):''}`;
    }
    if (type==='geo') {
      const lat=parseFloat(v1), lon=parseFloat(v2); if(!Number.isFinite(lat)||!Number.isFinite(lon)||lat<-90||lat>90||lon<-180||lon>180) throw new Error('Enter valid latitude and longitude values.'); return `geo:${lat},${lon}`;
    }
    return v1;
  }

  function generateQR(showErrors=true) {
    const container=document.getElementById('qrDisplay');
    try {
      const data=buildPayload();
      const fg=document.getElementById('fgColor').value, bg=document.getElementById('bgColor').value;
      const ratio=contrastRatio(fg,bg);
      container.innerHTML='';
      new QRCode(container,{text:data,width:+document.getElementById('res').value,height:+document.getElementById('res').value,colorDark:fg,colorLight:bg,correctLevel:QRCode.CorrectLevel.H});
      document.getElementById('dlBtn').classList.remove('hidden');
      setStatus(ratio<3 ? `Low color contrast (${ratio.toFixed(1)}:1). Scanning may be unreliable.` : 'QR code ready.', ratio<3?'warn':'');
    } catch(err) {
      if (showErrors) setStatus(err.message || 'Could not generate QR code.','error');
      document.getElementById('dlBtn').classList.add('hidden');
      if (showErrors) container.innerHTML='';
    }
  }

  function downloadQR() {
    const canvas=document.querySelector('#qrDisplay canvas'); if(!canvas) return;
    const a=document.createElement('a'); a.download='qr-code-'+document.getElementById('res').value+'px.png'; a.href=canvas.toDataURL('image/png'); a.click();
  }

  setupColor('fg','#000000'); setupColor('bg','#FFFFFF'); updateUI();
  if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script>
</body>
</html>
